<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicFix - My Complaints</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>CivicFix</h1>
    <p>My Complaints</p>
</header>

<main>

    <h2>My Complaints</h2>

    <p>
        Track the complaints you have submitted and check their current status.
    </p>

    <div id="complaints-container">
        Loading complaints...
    </div>

    <br>

    <a href="dashboard.html">
        <button>Back to Dashboard</button>
    </a>

</main>


<script>

fetch("/api/my-complaints")

    .then(response => response.json())

    .then(complaints => {

        const container =
            document.getElementById("complaints-container");

        container.innerHTML = "";

        if (complaints.length === 0) {

            container.innerHTML = `
                <div class="card">
                    <h3>No Complaints Found</h3>
                    <p>You have not submitted any complaints yet.</p>
                </div>
            `;

            return;
        }


        complaints.forEach(complaint => {

            const card = document.createElement("div");

            card.className = "card";


            card.innerHTML = `

                <h3>${complaint.title}</h3>

                <p>
                    <strong>Category:</strong>
                    ${complaint.category}
                </p>

                <p>
                    <strong>Description:</strong>
                    ${complaint.description}
                </p>

                <p>
                    <strong>Location:</strong>
                    ${complaint.location}
                </p>

                <p>
                    <strong>Severity:</strong>
                    ${complaint.severity}
                </p>

                <p>
                    <strong>Priority:</strong>
                    ${complaint.priority}
                </p>

                <p>
                    <strong>Priority Score:</strong>
                    ${complaint.priorityScore}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${complaint.status}
                </p>

            `;

            container.appendChild(card);

        });

    })


    .catch(error => {

        console.error(error);

        document.getElementById("complaints-container").innerHTML = `

            <div class="card">

                <h3>Unable to Load Complaints</h3>

                <p>
                    Something went wrong while loading your complaints.
                </p>

            </div>

        `;

    });

</script>

</body>
</html>
